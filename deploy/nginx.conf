# Private 5G NOC - Nginx Production Reverse Proxy Configuration
# Place in: /etc/nginx/sites-available/5g-noc.conf
# Enable: ln -s /etc/nginx/sites-available/5g-noc.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name noc.your5gdomain.com; # Replace with your custom domain or IP

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is installed)
    # return 301 https://$host$request_uri;

    # Static Frontend Assets (Vite Build Output)
    root /var/www/private-5g-noc/frontend/dist;
    index index.html;

    # Client-side SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy to Node.js/Express Backend
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

